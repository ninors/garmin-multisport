name: Merge Garmin Multisport FIT

on:
  schedule:
    # Sync & check automatically every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      activity_ids:
        description: "Comma-separated Garmin Activity ID(s) to convert to Multisport"
        required: false
        default: ""
        type: string
      profile:
        description: "Target Multisport profile (Triathlon, Duathlon, Swimrun, Aquathlon, Multisport)"
        required: false
        default: "Triathlon"
        type: string
      test_upload:
        description: "Upload a synthetic 5-leg Test Triathlon FIT"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

jobs:
  merge-multisport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/fit-merger/requirements.txt

      - name: Run Multisport FIT Merger & Export PWA Data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          ACTIVITY_IDS: ${{ github.event.inputs.activity_ids || '' }}
          TARGET_PROFILE: ${{ github.event.inputs.profile || 'Triathlon' }}
          TEST_UPLOAD: ${{ github.event.inputs.test_upload || 'false' }}
          EXPORT_JSON_PATH: docs/data/activities.json
        run: python tools/fit-merger/merge_multisport.py

      - name: Commit updated PWA data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/activities.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(pwa): sync Garmin activities data"
            git push
          fi
