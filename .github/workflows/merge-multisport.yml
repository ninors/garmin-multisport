name: Merge Garmin Multisport FIT

on:
  schedule:
    # Fastest interval supported by GitHub Actions cron (every 5 minutes)
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_upload:
        description: "Upload a synthetic 5-leg Test Triathlon FIT to verify Garmin Connect"
        required: false
        default: "false"
        type: string

jobs:
  merge-multisport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tools/fit-merger/requirements.txt

      - name: Run Multisport FIT Merger
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          TEST_UPLOAD: ${{ github.event.inputs.test_upload || 'false' }}
        run: python tools/fit-merger/merge_multisport.py
