<svg xmlns="http://www.w3.org/2000/svg" width="84" height="110" viewBox="0 0 84 110">
  <defs>
    <!-- Soft inward teal/cyan atmospheric glow -->
    <radialGradient id="haloTR" cx="88%" cy="48%" r="72%" fx="92%" fy="48%">
      <stop offset="0%" stop-color="#00EEFF" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#0099CC" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#004466" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Smooth longitudinal fade along the curved arc -->
    <linearGradient id="arcTR" x1="18%" y1="6%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#0055AA" stop-opacity="0"/>
      <stop offset="22%" stop-color="#0088DD" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#55FFFF" stop-opacity="1"/>
      <stop offset="78%" stop-color="#0088DD" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0055AA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Inward soft crescent halo -->
  <path d="M 28 8 A 190 190 0 0 1 78 102 L 46 102 A 164 164 0 0 0 6 24 Z" fill="url(#haloTR)"/>
  <!-- Sharp glowing cyan-blue outer bezel arc -->
  <path d="M 25 8 A 189 189 0 0 1 77 102" fill="none" stroke="url(#arcTR)" stroke-width="6.5" stroke-linecap="round"/>
</svg>
