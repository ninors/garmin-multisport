<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 54 54">
  <rect width="54" height="54" rx="27" fill="#000000"/>
  <!-- 3 anneaux horizontaux chevauchés (Rouge, Bleu, Vert) identiques à l'icône Garmin Multisport -->
  <!-- Anneau gauche : Rouge -->
  <circle cx="15.5" cy="27" r="9.5" fill="none" stroke="#FF2B2B" stroke-width="3.4"/>
  <!-- Anneau centre : Bleu (passe par-dessus Rouge) -->
  <circle cx="27" cy="27" r="9.5" fill="none" stroke="#0066B3" stroke-width="3.4"/>
  <!-- Anneau droite : Vert (passe par-dessus Bleu) -->
  <circle cx="38.5" cy="27" r="9.5" fill="none" stroke="#22CC33" stroke-width="3.4"/>
</svg>
