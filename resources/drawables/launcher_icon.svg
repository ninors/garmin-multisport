<svg xmlns="http://www.w3.org/2000/svg" width="54" height="54" viewBox="0 0 54 54">
  <!-- Fond circulaire noir AMOLED -->
  <circle cx="27" cy="27" r="27" fill="#000000"/>

  <!-- 3 anneaux entrelacés style Garmin Multisport (Bleu, Vert, Orange-Rouge) -->
  <!-- Anneau haut-gauche : Bleu Cyan (Natation) -->
  <circle cx="20" cy="22" r="10.5" fill="none" stroke="#00AAFF" stroke-width="3.6"/>

  <!-- Anneau haut-droite : Vert (Vélo) -->
  <circle cx="34" cy="22" r="10.5" fill="none" stroke="#00DD55" stroke-width="3.6"/>

  <!-- Anneau bas-centre : Orange-Rouge (Course) -->
  <circle cx="27" cy="33" r="10.5" fill="none" stroke="#FF5500" stroke-width="3.6"/>

  <!-- Entrelacement propre (passages dessus/dessous façon anneaux olympiques) -->
  <!-- Bleu repasse par-dessus Vert en haut -->
  <path d="M 27.4 14.6 A 10.5 10.5 0 0 1 30.2 19.5" fill="none" stroke="#000000" stroke-width="5.6"/>
  <path d="M 27.0 14.3 A 10.5 10.5 0 0 1 30.3 19.8" fill="none" stroke="#00AAFF" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Vert repasse par-dessus Orange-Rouge à droite -->
  <path d="M 35.8 32.3 A 10.5 10.5 0 0 1 28.5 31.2" fill="none" stroke="#000000" stroke-width="5.6"/>
  <path d="M 36.2 32.1 A 10.5 10.5 0 0 1 28.2 31.0" fill="none" stroke="#00DD55" stroke-width="3.6" stroke-linecap="round"/>

  <!-- Orange-Rouge repasse par-dessus Bleu à gauche -->
  <path d="M 17.5 28.5 A 10.5 10.5 0 0 1 22.8 23.4" fill="none" stroke="#000000" stroke-width="5.6"/>
  <path d="M 17.2 28.9 A 10.5 10.5 0 0 1 23.2 23.2" fill="none" stroke="#FF5500" stroke-width="3.6" stroke-linecap="round"/>
</svg>
